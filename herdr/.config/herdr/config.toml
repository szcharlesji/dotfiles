onboarding = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

[theme]
name = "terminal"
auto_switch = false

[keys]
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
# moved off prefix+e, which now opens the file viewer
edit_scrollback = "prefix+shift+e"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = '"${HERDR_BIN_PATH}" plugin pane open --plugin official.browser --entrypoint browser --placement overlay --focus'
description = "open browser overlay"

[[keys.command]]
key = "prefix+i"
type = "popup"
command = "lazygit"
description = "Lazygit in a floating popup"
width = "80%"
height = "80%"

[experimental]
# Requires a Kitty graphics-compatible outer terminal (Ghostty/kitty, not Alacritty).
kitty_graphics = true
