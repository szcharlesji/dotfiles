onboarding = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
status_indicators = "symbols"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[keys]
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
# moved off prefix+e, which now opens the file viewer
edit_scrollback = "prefix+shift+e"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+i"
type = "popup"
command = "lazygit"
description = "Lazygit in a floating popup"
width = "80%"
height = "80%"

[experimental]
# Requires a Kitty graphics-compatible outer terminal (Ghostty/kitty, not Alacritty).
kitty_graphics = true
