onboarding = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[theme]
name = "terminal"
auto_switch = true

[keys]
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

[experimental]
# Requires a Kitty graphics-compatible outer terminal (Ghostty/kitty, not Alacritty).
kitty_graphics = true
